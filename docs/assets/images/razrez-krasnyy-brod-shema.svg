<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Условный разрез: действующий угольный разрез с водоотливом, депрессионная воронка подземных вод, граница которой не одно число, участок со скважиной и пять проверок до бурения" font-family="'Golos Text', 'Helvetica Neue', Arial, sans-serif">
  <rect width="1200" height="800" fill="#F1F0EC"/>
  <defs>
    <clipPath id="g"><rect x="48" y="260" width="712" height="336"/></clipPath>
    <pattern id="filter" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#8C949C"/><rect x="2" y="3" width="6" height="3" fill="#FFFFFF"/>
    </pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#3E6E8E"/>
    </marker>
    <marker id="gr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#5A646E"/>
    </marker>
    <marker id="gl" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M10 0 L0 5 L10 10 z" fill="#5A646E"/>
    </marker>
  </defs>

  <text x="48" y="80" font-size="36" font-weight="700" fill="#16181B">Скважина рядом с разрезом: что проверить</text>
  <text x="48" y="116" font-size="22" fill="#5A646E">Разрез по местности — условно, не в масштабе</text>

  <!-- грунт -->
  <g clip-path="url(#g)">
    <rect x="48" y="260" width="712" height="336" fill="#6E6A63"/>
    <g stroke="#2E2C29" stroke-width="7">
      <path d="M40 360 L770 400"/>
      <path d="M40 440 L770 480"/>
      <path d="M40 520 L770 560"/>
    </g>
    <!-- водонасыщенная толща ниже широкой воронки -->
    <path d="M48 336 C90 360 150 440 190 470 L290 470 C400 410 600 322 752 320 L760 320 V596 H48 Z" fill="#3B7EA1" opacity="0.75"/>
    <!-- зона неопределённости между узкой и широкой воронкой -->
    <path d="M290 470 C340 400 400 322 480 320 L752 320 C600 322 400 410 290 470 Z" fill="#CFE3EE" opacity="0.6"/>
    <rect x="48" y="260" width="712" height="18" fill="#7A5A3A"/>
  </g>

  <!-- карьер -->
  <path d="M80 258 L100 320 L130 320 L150 390 L170 390 L190 470 L290 470 L310 390 L330 390 L350 320 L375 320 L395 258 Z" fill="#F1F0EC"/>
  <path d="M80 260 L100 320 L130 320 L150 390 L170 390 L190 470 L290 470 L310 390 L330 390 L350 320 L375 320 L395 260" fill="none" stroke="#5A646E" stroke-width="3"/>
  <rect x="252" y="456" width="36" height="12" fill="#3B7EA1"/>
  <!-- самосвал условно -->
  <rect x="200" y="440" width="34" height="18" fill="#F2B01E" stroke="#7E5900" stroke-width="2"/>
  <rect x="234" y="446" width="12" height="12" fill="#F2B01E" stroke="#7E5900" stroke-width="2"/>
  <circle cx="210" cy="462" r="5" fill="#2E2C29"/><circle cx="238" cy="462" r="5" fill="#2E2C29"/>

  <!-- водоотлив -->
  <path d="M270 458 V214 H400" fill="none" stroke="#3E6E8E" stroke-width="5" marker-end="url(#ar)"/>
  <text x="64" y="190" font-size="24" font-weight="700" fill="#16181B">Действующий разрез</text>
  <text x="414" y="222" font-size="22" font-weight="700" fill="#3E6E8E">Водоотлив: откачка</text>

  <!-- исходный уровень -->
  <line x1="48" y1="320" x2="100" y2="320" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="10 6"/>
  <line x1="350" y1="320" x2="760" y2="320" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="10 6"/>
  <!-- воронки -->
  <path d="M290 470 C340 400 400 322 480 320" fill="none" stroke="#3B7EA1" stroke-width="3"/>
  <path d="M290 470 C400 410 600 322 752 320" fill="none" stroke="#3B7EA1" stroke-width="3" stroke-dasharray="10 6"/>
  <path d="M190 470 C150 440 90 360 48 336" fill="none" stroke="#3B7EA1" stroke-width="3"/>

  <!-- участок -->
  <rect x="704" y="226" width="44" height="34" fill="#FFFFFF" stroke="#5A646E" stroke-width="2"/>
  <path d="M698 228 L726 204 L754 228 Z" fill="#B98C62" stroke="#5A646E" stroke-width="2"/>
  <rect x="664" y="238" width="16" height="262" fill="#8C949C" stroke="#16181B" stroke-width="2"/>
  <rect x="664" y="500" width="16" height="44" fill="url(#filter)" stroke="#16181B" stroke-width="2"/>
  <text x="752" y="160" font-size="24" font-weight="700" fill="#16181B" text-anchor="end">Участок со скважиной</text>

  <!-- подписи уровня и воронки -->
  <rect x="430" y="280" width="222" height="32" rx="5" fill="#FFFFFF" stroke="#C7C4BA" stroke-width="2"/>
  <text x="442" y="304" font-size="22" fill="#16181B">уровень до откачки</text>

  <line x1="486" y1="356" x2="652" y2="356" stroke="#5A646E" stroke-width="2" marker-start="url(#gl)" marker-end="url(#gr)"/>
  <rect x="549" y="340" width="40" height="32" fill="#FFFFFF"/>
  <text x="569" y="365" font-size="26" font-weight="700" fill="#A93F26" text-anchor="middle">?</text>

  <line x1="440" y1="498" x2="410" y2="420" stroke="#5A646E" stroke-width="2"/>
  <rect x="330" y="498" width="300" height="44" rx="5" fill="#FFFFFF" stroke="#C7C4BA" stroke-width="2"/>
  <text x="344" y="528" font-size="22" font-weight="700" fill="#3B7EA1">Депрессионная воронка</text>

  <!-- пояснение -->
  <rect x="48" y="616" width="712" height="136" rx="10" fill="#FFFFFF" stroke="#C7C4BA" stroke-width="2"/>
  <text x="68" y="654" font-size="24" font-weight="700" fill="#A93F26">Где кончается воронка — не одно число</text>
  <text x="68" y="688" font-size="22" fill="#16181B">зависит от пород, интенсивности откачки, глубины работ</text>
  <text x="68" y="720" font-size="22" fill="#16181B">и связности горизонтов; факт покажет пробная откачка</text>

  <!-- чек-лист -->
  <rect x="784" y="150" width="368" height="602" rx="10" fill="#FFFFFF" stroke="#C7C4BA" stroke-width="2"/>
  <text x="808" y="196" font-size="26" font-weight="700" fill="#16181B">Пять проверок</text>
  <text x="808" y="226" font-size="22" fill="#5A646E">до договора на бурение</text>
  <line x1="808" y1="248" x2="1128" y2="248" stroke="#DCDAD3" stroke-width="2"/>
  <g font-size="22">
    <circle cx="826" cy="287" r="18" fill="#F2B01E"/><text x="826" y="295" text-anchor="middle" font-weight="700" fill="#16181B">1</text>
    <text x="856" y="294" font-weight="700" fill="#16181B">Радиус водопонижения</text>
    <text x="856" y="324" fill="#16181B">— не одно число</text>
    <circle cx="826" cy="383" r="18" fill="#F2B01E"/><text x="826" y="391" text-anchor="middle" font-weight="700" fill="#16181B">2</text>
    <text x="856" y="390" font-weight="700" fill="#16181B">Как менялась вода</text>
    <text x="856" y="420" fill="#16181B">у соседей</text>
    <circle cx="826" cy="479" r="18" fill="#F2B01E"/><text x="826" y="487" text-anchor="middle" font-weight="700" fill="#16181B">3</text>
    <text x="856" y="486" font-weight="700" fill="#16181B">Данные мониторинга</text>
    <text x="856" y="516" fill="#16181B">по Краснобродскому</text>
    <text x="856" y="546" fill="#16181B">разрезу</text>
    <circle cx="826" cy="597" r="18" fill="#F2B01E"/><text x="826" y="605" text-anchor="middle" font-weight="700" fill="#16181B">4</text>
    <text x="856" y="604" font-weight="700" fill="#16181B">Запас по глубине</text>
    <text x="856" y="634" fill="#16181B">и изоляция горизонтов</text>
    <circle cx="826" cy="685" r="18" fill="#F2B01E"/><text x="826" y="693" text-anchor="middle" font-weight="700" fill="#16181B">5</text>
    <text x="856" y="692" font-weight="700" fill="#16181B">Вопросы соседям</text>
    <text x="856" y="722" fill="#16181B">и подрядчику</text>
  </g>
</svg>
