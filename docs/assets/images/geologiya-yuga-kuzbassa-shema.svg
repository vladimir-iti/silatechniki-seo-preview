<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Упрощённый разрез юга Кузбасса: аллювий речных долин, пермские угленосные толщи Кузнецкого бассейна и карбонатные породы Алтае-Томского массива" font-family="'Golos Text', 'Helvetica Neue', Arial, sans-serif">
  <rect width="1200" height="800" fill="#F1F0EC"/>
  <defs>
    <pattern id="sand" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#E3CF9E"/><circle cx="4" cy="5" r="2.2" fill="#C9B89A"/><circle cx="12" cy="12" r="2.6" fill="#C9B89A"/>
    </pattern>
    <pattern id="lime" width="64" height="32" patternUnits="userSpaceOnUse">
      <rect width="64" height="32" fill="#D9D4C4"/>
      <path d="M0 0.5 H64 M0 16.5 H64 M32 0 V16 M0 16 V32 M64 16 V32" stroke="#BDB6A3" stroke-width="2" fill="none"/>
    </pattern>
    <clipPath id="cb"><polygon points="48,272 150,272 196,300 380,300 424,272 700,270 760,262 800,254 740,752 48,752"/></clipPath>
    <clipPath id="cm"><polygon points="800,254 860,262 920,238 980,256 1040,234 1100,252 1152,244 1152,752 740,752"/></clipPath>
    <clipPath id="fr"><rect x="50" y="152" width="1100" height="598" rx="10"/></clipPath>
  </defs>
  <text x="48" y="84" font-size="36" font-weight="700" fill="#16181B">Юг Кузбасса: из чего состоит разрез</text>
  <text x="48" y="120" font-size="23" fill="#5A646E">Упрощённо, не в масштабе: два блока недр и речные наносы поверх них</text>
  <rect x="48" y="150" width="1104" height="602" rx="12" fill="#FFFFFF" stroke="#C7C4BA" stroke-width="2"/>
  <g clip-path="url(#fr)">
  <polygon points="48,272 150,272 196,300 380,300 424,272 700,270 760,262 800,254 740,752 48,752" fill="#6E6A63"/>
  <g clip-path="url(#cb)">
    <path d="M40 300 C 260 344, 520 344, 800 290" fill="none" stroke="#2E2C29" stroke-width="7"/>
    <path d="M40 364 C 260 408, 520 408, 800 354" fill="none" stroke="#2E2C29" stroke-width="7"/>
    <path d="M40 428 C 260 472, 520 472, 800 418" fill="none" stroke="#2E2C29" stroke-width="7"/>
    <path d="M40 492 C 260 536, 520 536, 800 482" fill="none" stroke="#2E2C29" stroke-width="7"/>
    <path d="M40 556 C 260 600, 520 600, 800 546" fill="none" stroke="#2E2C29" stroke-width="7"/>
