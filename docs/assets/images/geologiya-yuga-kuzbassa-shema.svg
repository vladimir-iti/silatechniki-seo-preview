  <polygon points="800,254 860,262 920,238 980,256 1040,234 1100,252 1152,244 1152,752 740,752" fill="url(#lime)"/>
  <g clip-path="url(#cm)">
    <rect x="700" y="230" width="460" height="250" fill="#3B7EA1" opacity="0.22"/>
    <rect x="700" y="600" width="460" height="160" fill="#A93F26" opacity="0.22"/>
    <line x1="700" y1="480" x2="1152" y2="480" stroke="#3B7EA1" stroke-width="3" stroke-dasharray="12 8"/>
    <line x1="700" y1="600" x2="1152" y2="600" stroke="#A93F26" stroke-width="3" stroke-dasharray="12 8"/>
  </g>
  <line x1="800" y1="254" x2="740" y2="752" stroke="#16181B" stroke-width="4" stroke-dasharray="14 8"/>
  <path d="M100 272 L150 272 L196 300 L380 300 L424 272 L470 272 C 430 372, 140 372, 100 272 Z" fill="url(#sand)" stroke="#5A646E" stroke-width="2"/>
  <path d="M112 290 C 160 358, 410 358, 458 290 L424 272 L380 300 L196 300 L150 272 Z" fill="#3B7EA1" opacity="0.30"/>
  <path d="M206 300 Q288 324 370 300 Z" fill="#3B7EA1"/>
  <polyline points="48,272 150,272 196,300 380,300 424,272 700,270 760,262 800,254 860,262 920,238 980,256 1040,234 1100,252 1152,244" fill="none" stroke="#7A5A3A" stroke-width="5"/>
  </g>
  <text x="72" y="190" font-size="26" font-weight="700" fill="#16181B">Кузнецкий бассейн</text>
  <text x="72" y="220" font-size="22" fill="#5A646E">Новокузнецк, Прокопьевск, Белово…</text>
  <text x="820" y="190" font-size="26" font-weight="700" fill="#16181B">Алтае-Томский массив</text>
  <text x="820" y="220" font-size="22" fill="#5A646E">Горная Шория и Салаир</text>
  <path d="M484 330 L466 330 L444 318" fill="none" stroke="#FFFFFF" stroke-width="3"/>
  <rect x="484" y="286" width="290" height="138" rx="6" fill="#FFFFFF" stroke="#C7C4BA" stroke-width="2"/>
  <text x="496" y="317" font-size="22" font-weight="700" fill="#16181B">Аллювий речных долин</text>
  <text x="496" y="347" font-size="22" fill="#16181B">пески, галечник, гравий</text>
  <text x="496" y="377" font-size="22" fill="#3B7EA1">мощность обычно 1–10 м</text>
  <text x="496" y="407" font-size="22" fill="#3B7EA1">вода на глубине 0–5 м</text>
  <rect x="64" y="392" width="370" height="138" rx="6" fill="#FFFFFF" stroke="#C7C4BA" stroke-width="2"/>
  <text x="76" y="423" font-size="22" font-weight="700" fill="#16181B">Угленосные толщи</text>
  <text x="76" y="453" font-size="22" fill="#16181B">пермь и нижний карбон</text>
  <text x="76" y="483" font-size="22" fill="#3B7EA1">трещиноватая зона до 130–150 м</text>
  <text x="76" y="513" font-size="22" fill="#3B7EA1">дебиты обычно 0,5–3,5 л/с</text>
  <rect x="64" y="612" width="420" height="78" rx="6" fill="#FFFFFF" stroke="#C7C4BA" stroke-width="2"/>
  <text x="76" y="643" font-size="22" fill="#16181B">Глубже 130–150 м трещиноватость</text>
  <text x="76" y="673" font-size="22" fill="#16181B">и водообильность падают</text>
  <rect x="820" y="280" width="322" height="168" rx="6" fill="#FFFFFF" stroke="#C7C4BA" stroke-width="2"/>
  <text x="832" y="311" font-size="22" font-weight="700" fill="#16181B">Карбон и девон</text>
  <text x="832" y="341" font-size="22" fill="#16181B">обводнена верхняя зона</text>
  <text x="832" y="371" font-size="22" fill="#3B7EA1">50–90 м, обычно до 150 м</text>
  <text x="832" y="401" font-size="22" fill="#16181B">закарстованные известняки</text>
  <text x="832" y="431" font-size="22" fill="#3B7EA1">— до 12,7–13,4 л/с</text>
  <rect x="820" y="618" width="322" height="108" rx="6" fill="#FFFFFF" stroke="#C7C4BA" stroke-width="2"/>
  <text x="832" y="649" font-size="22" font-weight="700" fill="#A93F26">Глубже 150–250 м</text>
  <text x="832" y="679" font-size="22" fill="#16181B">минерализация растёт,</text>
  <text x="832" y="709" font-size="22" fill="#16181B">местами до 3,5 г/дм³</text>
</svg>