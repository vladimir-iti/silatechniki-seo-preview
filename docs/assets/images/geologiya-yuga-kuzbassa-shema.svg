    <path d="M40 684 C 260 728, 520 728, 800 674" fill="none" stroke="#2E2C29" stroke-width="7"/>
    <path d="M40 748 C 260 792, 520 792, 800 738" fill="none" stroke="#2E2C29" stroke-width="7"/>
    <g stroke="#CFE3EE" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M80 560 l18 10 l-4 12 l16 8"/>
      <path d="M520 520 l18 10 l-4 12 l16 8"/>
      <path d="M700 300 l18 10 l-4 12 l16 8"/>
      <path d="M660 540 l18 10 l-4 12 l16 8"/>
      <path d="M470 470 l18 10 l-4 12 l16 8"/>
      <path d="M560 530 l18 10 l-4 12 l16 8"/>
      <path d="M620 470 l18 10 l-4 12 l16 8"/>
      <path d="M716 446 l18 10 l-4 12 l16 8"/>
      <path d="M600 320 l18 10 l-4 12 l16 8"/>
    </g>
    <line x1="48" y1="580" x2="800" y2="580" stroke="#CFE3EE" stroke-width="3" stroke-dasharray="12 8"/>
