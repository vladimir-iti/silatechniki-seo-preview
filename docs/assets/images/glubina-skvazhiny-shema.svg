  <g clip-path="url(#c2)">
    <rect x="824" y="222" width="320" height="507.5" fill="url(#lime)"/>
    <rect x="824" y="222" width="320" height="72.5" fill="#3B7EA1" opacity="0.40"/>
    <rect x="824" y="294.5" width="320" height="58.0" fill="#3B7EA1" opacity="0.28"/>
    <rect x="824" y="352.5" width="320" height="87.0" fill="#3B7EA1" opacity="0.14"/>
    <rect x="824" y="439.5" width="320" height="145.0" fill="#A93F26" opacity="0.14"/>
    <rect x="824" y="584.5" width="320" height="72.5" fill="#A93F26" opacity="0.26"/>
    <rect x="824" y="657.0" width="320" height="72.5" fill="#A93F26" opacity="0.40"/>
    <line x1="824" y1="439.5" x2="1144" y2="439.5" stroke="#A93F26" stroke-width="3" stroke-dasharray="10 6"/>
    <line x1="824" y1="657.0" x2="1144" y2="657.0" stroke="#A93F26" stroke-width="3" stroke-dasharray="10 6"/>
  </g>
  <rect x="849" y="212" width="18" height="97.0" fill="#8C949C" stroke="#5A646E" stroke-width="2"/>
  <rect x="849" y="309.0" width="18" height="29.0" fill="#CFE3EE" stroke="#5A646E" stroke-width="2" stroke-dasharray="4 3"/>
  <rect x="136" y="222" width="320" height="507.5" fill="none" stroke="#C7C4BA" stroke-width="2"/>
  <rect x="480" y="222" width="320" height="507.5" fill="none" stroke="#C7C4BA" stroke-width="2"/>
  <rect x="824" y="222" width="320" height="507.5" fill="none" stroke="#C7C4BA" stroke-width="2"/>
  <path d="M186 280 L156 280 L156 229.2" fill="none" stroke="#5A646E" stroke-width="2"/>
  <rect x="186" y="262" width="264" height="108" rx="6" fill="#FFFFFF" stroke="#C7C4BA" stroke-width="2"/>
  <text x="198" y="293" font-size="22" font-weight="700" fill="#16181B">Вода — на первых</text>
  <text x="198" y="323" font-size="22" fill="#16181B">метрах глубины,</text>
  <text x="198" y="353" font-size="22" fill="#3B7EA1">иногда меньше 10 м</text>
  <rect x="186" y="386" width="258" height="214" rx="6" fill="#FFFFFF" stroke="#C7C4BA" stroke-width="2"/>
  <text x="198" y="416" font-size="22" fill="#5A646E">первые 10 м крупно</text>
  <rect x="198" y="432" width="234" height="14" fill="#DCDAD3"/>
  <rect x="198" y="446" width="234" height="140" fill="url(#sand)"/>
  <rect x="198" y="474" width="234" height="112" fill="#3B7EA1" opacity="0.35"/>
  <line x1="198" y1="474" x2="432" y2="474" stroke="#3B7EA1" stroke-width="3"/>
  <rect x="226" y="426" width="16" height="116" fill="#8C949C" stroke="#5A646E" stroke-width="2"/>
  <rect x="226" y="542" width="16" height="34" fill="url(#filter)" stroke="#5A646E" stroke-width="2"/>
  <text x="422" y="578" font-size="22" fill="#16181B" text-anchor="end">10 м</text>
  <rect x="186" y="616" width="264" height="108" rx="6" fill="#FFFFFF" stroke="#C7C4BA" stroke-width="2"/>
  <text x="198" y="647" font-size="22" fill="#16181B">Мелко — не хуже,</text>
  <text x="198" y="677" font-size="22" fill="#16181B">но уязвимее к тому,</text>
  <text x="198" y="707" font-size="22" fill="#16181B">что рядом</text>
  <rect x="530" y="232" width="264" height="78" rx="6" fill="#FFFFFF" stroke="#C7C4BA" stroke-width="2"/>
  <text x="542" y="263" font-size="22" font-weight="700" fill="#16181B">Глубже в толще:</text>
  <text x="542" y="293" font-size="22" fill="#16181B">стабильнее, не чище</text>
  <rect x="530" y="322" width="264" height="78" rx="6" fill="#FFFFFF" stroke="#C7C4BA" stroke-width="2"/>
  <text x="542" y="353" font-size="22" fill="#16181B">Железо, жёсткость</text>
  <text x="542" y="383" font-size="22" fill="#16181B">те же на 30 и 90 м</text>
  <rect x="530" y="453.5" width="264" height="78" rx="6" fill="#FFFFFF" stroke="#C7C4BA" stroke-width="2"/>
  <text x="542" y="484.5" font-size="22" font-weight="700" fill="#16181B">Трещиноватая зона</text>
  <text x="542" y="514.5" font-size="22" fill="#3B7EA1">до 130–150 м</text>
  <rect x="874" y="236" width="264" height="108" rx="6" fill="#FFFFFF" stroke="#C7C4BA" stroke-width="2"/>
  <text x="886" y="267" font-size="22" font-weight="700" fill="#16181B">Самая водообильная</text>
  <text x="886" y="297" font-size="22" fill="#3B7EA1">зона: 50–90 м,</text>
  <text x="886" y="327" font-size="22" fill="#3B7EA1">местами до 150 м</text>
  <rect x="874" y="449.5" width="264" height="108" rx="6" fill="#FFFFFF" stroke="#C7C4BA" stroke-width="2"/>
  <text x="886" y="480.5" font-size="22" font-weight="700" fill="#A93F26">Глубже 150–250 м</text>
  <text x="886" y="510.5" font-size="22" fill="#16181B">минерализация растёт,</text>
  <text x="886" y="540.5" font-size="22" fill="#16181B">местами до 3,5 г/дм³</text>
  <rect x="874" y="604" width="264" height="108" rx="6" fill="#FFFFFF" stroke="#C7C4BA" stroke-width="2"/>
  <text x="886" y="635" font-size="22" font-weight="700" fill="#A93F26">Глубже 300–350 м</text>
  <text x="886" y="665" font-size="22" fill="#16181B">местами состав —</text>
  <text x="886" y="695" font-size="22" fill="#16181B">сульфатно-хлоридный</text>
</svg>