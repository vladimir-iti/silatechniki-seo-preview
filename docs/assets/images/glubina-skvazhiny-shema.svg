    <rect x="480" y="410.5" width="320" height="29.0" fill="#CFE3EE" opacity="0.35"/>
    <line x1="480" y1="410.5" x2="800" y2="410.5" stroke="#CFE3EE" stroke-width="3" stroke-dasharray="10 6"/>
    <line x1="480" y1="439.5" x2="800" y2="439.5" stroke="#CFE3EE" stroke-width="3" stroke-dasharray="10 6"/>
  </g>
  <rect x="505" y="212" width="18" height="126.0" fill="#8C949C" stroke="#16181B" stroke-width="2"/>
