<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Три разреза в едином масштабе глубин: речной аллювий с водой на первых метрах, угленосная толща с трещиноватой зоной до 130–150 м, карбонатный массив с ростом минерализации глубже 150–250 м" font-family="'Golos Text', 'Helvetica Neue', Arial, sans-serif">
  <rect width="1200" height="800" fill="#F1F0EC"/>
  <defs>
    <pattern id="sand" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#E3CF9E"/><circle cx="4" cy="4" r="2" fill="#C9B89A"/><circle cx="11" cy="10" r="2" fill="#C9B89A"/>
    </pattern>
    <pattern id="lime" width="64" height="32" patternUnits="userSpaceOnUse">
      <rect width="64" height="32" fill="#D9D4C4"/>
      <path d="M0 0.5 H64 M0 16.5 H64 M32 0 V16 M0 16 V32 M64 16 V32" stroke="#BDB6A3" stroke-width="2" fill="none"/>
    </pattern>
    <pattern id="filter" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#8C949C"/><rect x="2" y="3" width="6" height="3" fill="#FFFFFF"/>
    </pattern>

    <clipPath id="c0"><rect x="136" y="222" width="320" height="507.5"/></clipPath>
    <clipPath id="c1"><rect x="480" y="222" width="320" height="507.5"/></clipPath>
    <clipPath id="c2"><rect x="824" y="222" width="320" height="507.5"/></clipPath>
  </defs>
  <text x="48" y="80" font-size="36" font-weight="700" fill="#16181B">Какая глубина нужна: три сценария юга Кузбасса</text>
  <text x="48" y="116" font-size="23" fill="#5A646E">Глубины — в едином масштабе, ширина колонок условная</text>
  <line x1="120" y1="222" x2="120" y2="729.5" stroke="#5A646E" stroke-width="2"/>
  <line x1="112" y1="222.0" x2="120" y2="222.0" stroke="#5A646E" stroke-width="2"/>
  <text x="106" y="230.0" font-size="22" fill="#5A646E" text-anchor="end">0 м</text>
  <line x1="112" y1="294.5" x2="120" y2="294.5" stroke="#5A646E" stroke-width="2"/>
  <text x="106" y="302.5" font-size="22" fill="#5A646E" text-anchor="end">50 м</text>
  <line x1="112" y1="367.0" x2="120" y2="367.0" stroke="#5A646E" stroke-width="2"/>
  <text x="106" y="375.0" font-size="22" fill="#5A646E" text-anchor="end">100 м</text>
  <line x1="112" y1="439.5" x2="120" y2="439.5" stroke="#5A646E" stroke-width="2"/>
  <text x="106" y="447.5" font-size="22" fill="#5A646E" text-anchor="end">150 м</text>
  <line x1="112" y1="512.0" x2="120" y2="512.0" stroke="#5A646E" stroke-width="2"/>
  <text x="106" y="520.0" font-size="22" fill="#5A646E" text-anchor="end">200 м</text>
  <line x1="112" y1="584.5" x2="120" y2="584.5" stroke="#5A646E" stroke-width="2"/>
  <text x="106" y="592.5" font-size="22" fill="#5A646E" text-anchor="end">250 м</text>
  <line x1="112" y1="657.0" x2="120" y2="657.0" stroke="#5A646E" stroke-width="2"/>
  <text x="106" y="665.0" font-size="22" fill="#5A646E" text-anchor="end">300 м</text>
  <line x1="112" y1="729.5" x2="120" y2="729.5" stroke="#5A646E" stroke-width="2"/>
  <text x="106" y="737.5" font-size="22" fill="#5A646E" text-anchor="end">350 м</text>
  <text x="136" y="164" font-size="24" font-weight="700" fill="#16181B">Речной аллювий</text>
  <text x="136" y="194" font-size="22" fill="#5A646E">пойма, первая терраса</text>
  <text x="480" y="164" font-size="24" font-weight="700" fill="#16181B">Угленосная толща</text>
  <text x="480" y="194" font-size="22" fill="#5A646E">большинство участков</text>
  <text x="824" y="164" font-size="24" font-weight="700" fill="#16181B">Карбонатный массив</text>
  <text x="824" y="194" font-size="22" fill="#5A646E">юг и юго-запад региона</text>
