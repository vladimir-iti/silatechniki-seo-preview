<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Разрез: колодец в верхнем водоносном горизонте с сезонными колебаниями уровня и загрязнением с поверхности, скважина с обсадной колонной до глубокого горизонта" font-family="'Golos Text', 'Helvetica Neue', Arial, sans-serif">
  <rect width="1200" height="800" fill="#F1F0EC"/>
  <defs>
    <pattern id="sand" width="28" height="28" patternUnits="userSpaceOnUse">
      <rect width="28" height="28" fill="#E3CF9E"/>
      <circle cx="6" cy="7" r="2.6" fill="#C9B89A"/>
      <circle cx="20" cy="20" r="3.4" fill="#C9B89A"/>
    </pattern>
    <pattern id="filter" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#8C949C"/>
      <rect x="2" y="3" width="8" height="3" fill="#FFFFFF"/>
    </pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#A93F26"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#3B7EA1"/>
    </marker>
    <clipPath id="clip"><rect x="50" y="162" width="1100" height="588" rx="10"/></clipPath>
  </defs>

  <text x="48" y="86" font-size="36" font-weight="700" fill="#16181B">Колодец и скважина: с какого горизонта вода</text>
  <text x="48" y="124" font-size="23" fill="#5A646E">Колодец берёт первый от поверхности слой, скважина может уйти глубже. Условно, не в масштабе</text>

  <rect x="48" y="160" width="1104" height="592" rx="12" fill="#FFFFFF" stroke="#C7C4BA" stroke-width="2"/>
  <g clip-path="url(#clip)">
    <rect x="48" y="262" width="1104" height="22" fill="#7A5A3A"/>
    <rect x="48" y="284" width="1104" height="196" fill="url(#sand)"/>
    <!-- seasonal water: high and low -->
    <rect x="48" y="310" width="1104" height="60" fill="#3B7EA1" opacity="0.12"/>
    <rect x="48" y="370" width="1104" height="110" fill="#3B7EA1" opacity="0.28"/>
    <line x1="48" y1="310" x2="1152" y2="310" stroke="#3B7EA1" stroke-width="3" stroke-dasharray="10 7"/>
    <line x1="48" y1="370" x2="1152" y2="370" stroke="#3B7EA1" stroke-width="3" stroke-dasharray="10 7"/>
    <rect x="48" y="480" width="1104" height="130" fill="#B98C62"/>
    <line x1="48" y1="480" x2="1152" y2="480" stroke="#5A646E" stroke-width="2"/>
    <rect x="48" y="610" width="1104" height="142" fill="#9A948A"/>
    <line x1="48" y1="610" x2="1152" y2="610" stroke="#5A646E" stroke-width="2"/>
    <g stroke="#CFE3EE" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M880 640 L920 656 L960 650 L1000 672"/>
      <path d="M1030 700 L1070 690 L1110 716"/>
      <path d="M880 716 L910 730 L950 726"/>
      <path d="M1060 630 L1100 648 L1130 640"/>
    </g>
  </g>

  <!-- pollution source -->
  <path d="M72 262 L84 286 L136 286 L148 262 Z" fill="#F3DDD6" stroke="#A93F26" stroke-width="3"/>
  <text x="64" y="200" font-size="24" font-weight="700" fill="#A93F26">Загрязнение с поверхности</text>
  <line x1="110" y1="210" x2="110" y2="256" stroke="#A93F26" stroke-width="2"/>
  <path d="M124 292 C170 300, 210 316, 240 334" fill="none" stroke="#A93F26" stroke-width="4" stroke-dasharray="10 6" marker-end="url(#ar)"/>
  <path d="M104 294 C110 350, 130 400, 150 446" fill="none" stroke="#A93F26" stroke-width="4" stroke-dasharray="10 6" marker-end="url(#ar)"/>

  <!-- well (kolodets) -->
  <rect x="250" y="234" width="84" height="212" fill="#DCDAD3" stroke="#8C949C" stroke-width="3"/>
  <rect x="264" y="240" width="56" height="200" fill="#FFFFFF"/>
  <rect x="264" y="340" width="56" height="100" fill="#CFE3EE"/>
  <line x1="264" y1="340" x2="320" y2="340" stroke="#3B7EA1" stroke-width="3"/>
  <g stroke="#8C949C" stroke-width="3">
    <line x1="250" y1="286" x2="334" y2="286"/>
    <line x1="250" y1="338" x2="334" y2="338"/>
    <line x1="250" y1="392" x2="334" y2="392"/>
  </g>
  <text x="348" y="248" font-size="26" font-weight="700" fill="#16181B">Колодец</text>

  <!-- seasonal bracket -->
  <line x1="352" y1="314" x2="352" y2="366" stroke="#3B7EA1" stroke-width="3" marker-start="url(#ab)" marker-end="url(#ab)"/>
  <line x1="356" y1="340" x2="370" y2="340" stroke="#5A646E" stroke-width="2"/>
  <rect x="370" y="318" width="350" height="44" rx="6" fill="#FFFFFF" stroke="#3B7EA1" stroke-width="2"/>
  <text x="384" y="348" font-size="24" fill="#3B7EA1">Сезонные колебания уровня</text>

  <rect x="370" y="384" width="420" height="80" rx="6" fill="#FFFFFF" stroke="#C7C4BA" stroke-width="2"/>
  <text x="384" y="415" font-size="22" font-weight="700" fill="#16181B">Первый от поверхности горизонт</text>
  <text x="384" y="447" font-size="22" fill="#16181B">мощность 1–10 м, вода на 0–5 м</text>

  <rect x="64" y="524" width="494" height="44" rx="6" fill="#FFFFFF" stroke="#C7C4BA" stroke-width="2"/>
  <text x="78" y="554" font-size="22" fill="#16181B">Перекрывающие породы — десятки метров</text>

  <rect x="64" y="626" width="560" height="112" rx="6" fill="#FFFFFF" stroke="#C7C4BA" stroke-width="2"/>
  <text x="78" y="656" font-size="22" font-weight="700" fill="#16181B">Санитарные нормы одинаковы для обоих:</text>
  <text x="78" y="688" font-size="22" fill="#16181B">не менее 50 м выше по потоку от загрязнения,</text>
  <text x="78" y="718" font-size="22" fill="#16181B">не ближе 30 м от автомагистралей</text>

  <!-- borehole -->
  <rect x="812" y="236" width="36" height="408" fill="#8C949C" stroke="#5A646E" stroke-width="2"/>
  <rect x="812" y="644" width="36" height="86" fill="url(#filter)" stroke="#5A646E" stroke-width="2"/>
  <rect x="802" y="226" width="56" height="14" rx="3" fill="#16181B"/>
  <text x="870" y="248" font-size="26" font-weight="700" fill="#16181B">Скважина</text>

  <line x1="850" y1="545" x2="872" y2="545" stroke="#5A646E" stroke-width="2"/>
  <rect x="872" y="506" width="266" height="80" rx="6" fill="#FFFFFF" stroke="#C7C4BA" stroke-width="2"/>
  <text x="886" y="537" font-size="22" fill="#16181B">Обсадная колонна</text>
  <text x="886" y="567" font-size="22" fill="#16181B">изолирует ствол</text>

  <line x1="850" y1="700" x2="872" y2="700" stroke="#5A646E" stroke-width="2"/>
  <rect x="872" y="660" width="266" height="80" rx="6" fill="#FFFFFF" stroke="#C7C4BA" stroke-width="2"/>
  <text x="886" y="691" font-size="22" font-weight="700" fill="#16181B">Глубокий горизонт:</text>
  <text x="886" y="721" font-size="22" fill="#16181B">меньше колебаний</text>
</svg>
