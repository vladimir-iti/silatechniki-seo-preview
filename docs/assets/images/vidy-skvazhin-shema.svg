<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Разрез: скважина на песок с обсадной трубой и фильтром и скважина в трещиноватом известняке с открытым стволом без фильтра" font-family="'Golos Text', 'Helvetica Neue', Arial, sans-serif">
  <rect width="1200" height="800" fill="#F1F0EC"/>
  <defs>
    <pattern id="sand" width="28" height="28" patternUnits="userSpaceOnUse">
      <rect width="28" height="28" fill="#E3CF9E"/>
      <circle cx="6" cy="7" r="2.6" fill="#C9B89A"/>
      <circle cx="20" cy="20" r="3" fill="#C9B89A"/>
      <circle cx="18" cy="6" r="2" fill="#3B7EA1" opacity="0.55"/>
      <circle cx="7" cy="21" r="2" fill="#3B7EA1" opacity="0.55"/>
    </pattern>
    <pattern id="lime" width="80" height="40" patternUnits="userSpaceOnUse">
      <rect width="80" height="40" fill="#D9D4C4"/>
      <path d="M0 0.5 H80 M0 20.5 H80 M40 0 V20 M0 20 V40 M80 20 V40" stroke="#BDB6A3" stroke-width="2" fill="none"/>
    </pattern>
    <pattern id="filter" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#8C949C"/>
      <rect x="2" y="3" width="8" height="3" fill="#FFFFFF"/>
    </pattern>
    <clipPath id="clipL"><rect x="50" y="162" width="536" height="588" rx="10"/></clipPath>
    <clipPath id="clipR"><rect x="614" y="162" width="536" height="588" rx="10"/></clipPath>
  </defs>

  <text x="48" y="86" font-size="36" font-weight="700" fill="#16181B">Скважина на песок и скважина в скальной породе</text>
  <text x="48" y="124" font-size="23" fill="#5A646E">Тип задаёт водоносный горизонт, а не название в прайсе. Условно, не в масштабе</text>

  <!-- LEFT PANEL -->
  <rect x="48" y="160" width="540" height="592" rx="12" fill="#FFFFFF" stroke="#C7C4BA" stroke-width="2"/>
  <g clip-path="url(#clipL)">
    <rect x="48" y="252" width="540" height="30" fill="#7A5A3A"/>
    <rect x="48" y="282" width="540" height="120" fill="#B98C62"/>
    <rect x="48" y="402" width="540" height="350" fill="url(#sand)"/>
    <line x1="48" y1="402" x2="588" y2="402" stroke="#5A646E" stroke-width="2"/>
  </g>
  <text x="72" y="204" font-size="26" font-weight="700" fill="#16181B">Скважина на песок</text>
  <!-- casing + filter -->
  <rect x="106" y="226" width="32" height="244" fill="#8C949C" stroke="#5A646E" stroke-width="2"/>
  <rect x="106" y="470" width="32" height="170" fill="url(#filter)" stroke="#5A646E" stroke-width="2"/>
  <rect x="104" y="640" width="36" height="14" fill="#5A646E"/>
  <rect x="100" y="220" width="44" height="10" fill="#5A646E"/>

  <!-- left callouts -->
  <line x1="140" y1="340" x2="184" y2="340" stroke="#5A646E" stroke-width="2"/>
  <rect x="184" y="318" width="214" height="44" rx="6" fill="#FFFFFF" stroke="#C7C4BA" stroke-width="2"/>
  <text x="198" y="348" font-size="24" fill="#16181B">Обсадная труба</text>

  <line x1="140" y1="540" x2="184" y2="540" stroke="#5A646E" stroke-width="2"/>
  <rect x="184" y="474" width="390" height="124" rx="6" fill="#FFFFFF" stroke="#C7C4BA" stroke-width="2"/>
  <text x="198" y="506" font-size="24" font-weight="700" fill="#16181B">Фильтр обязателен</text>
  <text x="198" y="536" font-size="24" fill="#16181B">пропускает воду, держит песок</text>
  <text x="198" y="578" font-size="22" fill="#5A646E">СП 31.13330.2021, п. 8.14</text>

  <rect x="184" y="640" width="390" height="88" rx="6" fill="#FFFFFF" stroke="#C7C4BA" stroke-width="2"/>
  <text x="198" y="674" font-size="24" font-weight="700" fill="#16181B">Пески, гравий, галечник</text>
  <text x="198" y="706" font-size="24" fill="#3B7EA1">вода — между частицами</text>

  <!-- RIGHT PANEL -->
  <rect x="612" y="160" width="540" height="592" rx="12" fill="#FFFFFF" stroke="#C7C4BA" stroke-width="2"/>
  <g clip-path="url(#clipR)">
    <rect x="612" y="252" width="540" height="30" fill="#7A5A3A"/>
    <rect x="612" y="282" width="540" height="90" fill="#B98C62"/>
    <rect x="612" y="372" width="540" height="380" fill="url(#lime)"/>
    <line x1="612" y1="372" x2="1152" y2="372" stroke="#5A646E" stroke-width="2"/>
    <!-- fractures with water -->
    <g stroke="#3B7EA1" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M640 420 L668 446 L660 470 L690 500"/>
      <path d="M630 560 L664 575 L700 568 L720 590"/>
      <path d="M880 400 L920 414 L950 408 L990 430"/>
      <path d="M654 660 L680 690 L716 700"/>
      <path d="M860 596 L900 610 L940 604 L975 624"/>
      <path d="M1040 400 L1070 420 L1110 424"/>
    </g>
  </g>
  <text x="636" y="204" font-size="26" font-weight="700" fill="#16181B">Скважина в скальной породе</text>
  <!-- casing to top of rock -->
  <rect x="706" y="226" width="32" height="186" fill="#8C949C" stroke="#5A646E" stroke-width="2"/>
  <rect x="700" y="220" width="44" height="10" fill="#5A646E"/>
  <!-- open hole -->
  <path d="M708 412 L706 440 L710 470 L705 500 L709 530 L706 560 L710 590 L706 620 L709 650 L707 680 L737 680 L739 650 L735 620 L740 590 L736 560 L739 530 L735 500 L740 470 L736 440 L737 412 Z" fill="#CFE3EE" stroke="#5A646E" stroke-width="3"/>

  <!-- right callouts -->
  <line x1="740" y1="310" x2="784" y2="310" stroke="#5A646E" stroke-width="2"/>
  <rect x="784" y="288" width="214" height="44" rx="6" fill="#FFFFFF" stroke="#C7C4BA" stroke-width="2"/>
  <text x="798" y="318" font-size="24" fill="#16181B">Обсадная труба</text>

  <line x1="742" y1="520" x2="770" y2="520" stroke="#5A646E" stroke-width="2"/>
  <rect x="770" y="454" width="370" height="124" rx="6" fill="#FFFFFF" stroke="#C7C4BA" stroke-width="2"/>
  <text x="786" y="486" font-size="24" font-weight="700" fill="#16181B">Открытый ствол</text>
  <text x="786" y="516" font-size="24" fill="#16181B">без фильтра: устойчивая</text>
  <text x="786" y="546" font-size="24" fill="#16181B">порода держит форму сама</text>

  <rect x="770" y="640" width="370" height="88" rx="6" fill="#FFFFFF" stroke="#C7C4BA" stroke-width="2"/>
  <text x="786" y="674" font-size="24" font-weight="700" fill="#16181B">Трещиноватый известняк</text>
  <text x="786" y="706" font-size="24" fill="#3B7EA1">вода — по трещинам и порам</text>
</svg>
