<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Два разреза: скважинный адаптер с боковым выходом воды ниже глубины промерзания и кессон — камера ниже глубины промерзания; при высоком уровне грунтовых вод кессону грозят всплытие и затопление" font-family="'Golos Text', 'Helvetica Neue', Arial, sans-serif">
  <rect width="1200" height="800" fill="#F1F0EC"/>
  <defs>
    <marker id="au" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3B7EA1"/></marker>
  </defs>
  <text x="48" y="84" font-size="36" font-weight="700" fill="#16181B">Кессон или адаптер: решают две величины</text>
  <text x="48" y="122" font-size="22" fill="#5A646E">Разрез у устья скважины, условно, не в масштабе</text>
  <rect x="48" y="150" width="540" height="550" rx="10" fill="#FFFFFF" stroke="#C7C4BA" stroke-width="2"/>
  <rect x="48" y="336" width="540" height="224" fill="#B98C62"/>
  <path d="M48 560 H588 V690 Q588 700 578 700 H58 Q48 700 48 690 Z" fill="#CFE3EE"/>
  <line x1="48" y1="336" x2="588" y2="336" stroke="#7A5A3A" stroke-width="6"/>
  <line x1="48" y1="440" x2="588" y2="440" stroke="#FFFFFF" stroke-width="4" stroke-dasharray="14 8"/>
  <line x1="48" y1="560" x2="588" y2="560" stroke="#3B7EA1" stroke-width="4" stroke-dasharray="14 8"/>
  <rect x="612" y="150" width="540" height="550" rx="10" fill="#FFFFFF" stroke="#C7C4BA" stroke-width="2"/>
  <rect x="612" y="336" width="540" height="224" fill="#B98C62"/>
  <path d="M612 560 H1152 V690 Q1152 700 1142 700 H622 Q612 700 612 690 Z" fill="#CFE3EE"/>
  <line x1="612" y1="336" x2="1152" y2="336" stroke="#7A5A3A" stroke-width="6"/>
  <line x1="612" y1="440" x2="1152" y2="440" stroke="#FFFFFF" stroke-width="4" stroke-dasharray="14 8"/>
  <line x1="612" y1="560" x2="1152" y2="560" stroke="#3B7EA1" stroke-width="4" stroke-dasharray="14 8"/>

  <!-- заголовки панелей -->
  <text x="72" y="192" font-size="28" font-weight="700" fill="#16181B">Адаптер</text>
  <text x="72" y="226" font-size="22" fill="#16181B">Уместен: доступ к узлу на месте не нужен.</text>
  <text x="72" y="254" font-size="22" fill="#16181B">При высоких грунтовых водах надёжнее:</text>
  <text x="72" y="282" font-size="22" fill="#2C7350">Полости нет — всплывать и топить нечему</text>
  <text x="636" y="192" font-size="28" font-weight="700" fill="#16181B">Кессон</text>
  <text x="636" y="226" font-size="22" fill="#16181B">Уместен: нужен доступ к автоматике</text>
  <text x="636" y="254" font-size="22" fill="#16181B">и соединениям, грунт достаточно сухой.</text>
  <text x="636" y="282" font-size="22" fill="#A93F26">Высокие воды: анкеровка и герметизация</text>

  <!-- адаптер -->
  <rect x="300" y="318" width="36" height="382" fill="#8C949C" stroke="#5A646E" stroke-width="2"/>
  <rect x="292" y="310" width="52" height="12" rx="3" fill="#16181B"/>
  <line x1="318" y1="696" x2="318" y2="486" stroke="#3E6E8E" stroke-width="8"/>
  <line x1="318" y1="486" x2="588" y2="486" stroke="#3E6E8E" stroke-width="10"/>
  <circle cx="318" cy="486" r="9" fill="#16181B"/>
  <text x="352" y="524" font-size="22" font-weight="700" fill="#FFFFFF">выход воды —</text>
  <text x="352" y="546" font-size="22" font-weight="700" fill="#FFFFFF">ниже промерзания</text>

  <!-- подписи линий -->
  <text x="64" y="404" font-size="22" font-weight="700" fill="#FFFFFF">расчётная глубина</text>
  <text x="64" y="430" font-size="22" font-weight="700" fill="#FFFFFF">промерзания</text>
  <text x="64" y="594" font-size="22" font-weight="700" fill="#16181B">высокий уровень</text>
  <text x="64" y="620" font-size="22" font-weight="700" fill="#16181B">грунтовых вод</text>

  <!-- кессон -->
  <rect x="872" y="360" width="36" height="340" fill="#8C949C" stroke="#5A646E" stroke-width="2"/>
  <rect x="800" y="336" width="180" height="264" fill="#FFFFFF"/>
  <rect x="872" y="470" width="36" height="130" fill="#8C949C" stroke="#5A646E" stroke-width="2"/>
  <rect x="864" y="462" width="52" height="12" rx="3" fill="#16181B"/>
  <path d="M890 474 V510 H1152" fill="none" stroke="#3E6E8E" stroke-width="10"/>
  <rect x="800" y="336" width="180" height="264" fill="none" stroke="#16181B" stroke-width="5"/>
  <rect x="850" y="314" width="80" height="22" fill="#FFFFFF" stroke="#16181B" stroke-width="4"/>
  <rect x="840" y="306" width="100" height="10" rx="3" fill="#16181B"/>
  <text x="890" y="400" font-size="22" font-weight="700" fill="#5A646E" text-anchor="middle">камера</text>
  <text x="890" y="426" font-size="22" fill="#5A646E" text-anchor="middle">с доступом</text>
  <line x1="830" y1="664" x2="830" y2="614" stroke="#3B7EA1" stroke-width="4" marker-end="url(#au)"/>
  <line x1="950" y1="664" x2="950" y2="614" stroke="#3B7EA1" stroke-width="4" marker-end="url(#au)"/>
  <text x="632" y="610" font-size="22" font-weight="700" fill="#A93F26">риск:</text>
  <text x="632" y="636" font-size="22" font-weight="700" fill="#16181B">всплытие,</text>
  <text x="632" y="662" font-size="22" font-weight="700" fill="#16181B">затопление</text>

  <text x="48" y="740" font-size="22" fill="#5A646E">Глубина промерзания зависит от грунта: на песке больше, чем на глине (СП 22.13330.2016, п. 5.5.3)</text>
</svg>
