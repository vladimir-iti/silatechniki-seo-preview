<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="План участка: проезд техники к скважине сейчас и для ремонта, будущие постройки и деревья у оголовка, низина со стоком и соседский септик" font-family="'Golos Text', 'Helvetica Neue', Arial, sans-serif">
  <rect width="1200" height="800" fill="#F1F0EC"/>
  <defs>
    <marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#3B7EA1"/>
    </marker>
  </defs>
  <text x="48" y="84" font-size="36" font-weight="700" fill="#16181B">Где бурить: что проверить на плане участка</text>
  <text x="48" y="122" font-size="22" fill="#5A646E">Место выбирают один раз — смотрите на годы вперёд. Условно, не в масштабе</text>

  <!-- соседний участок -->
  <rect x="48" y="150" width="712" height="74" fill="#E6E4DD"/>
  <text x="72" y="196" font-size="22" fill="#5A646E">Соседний участок</text>
  <rect x="566" y="164" width="48" height="46" rx="4" fill="#B98C62" stroke="#7A5A3A" stroke-width="3"/>
  <text x="628" y="196" font-size="22" font-weight="700" fill="#16181B">септик</text>

  <!-- участок -->
  <rect x="48" y="224" width="712" height="448" fill="#FFFFFF"/>
  <!-- улица -->
  <rect x="48" y="672" width="712" height="80" fill="#DCDAD3"/>
  <text x="80" y="720" font-size="22" fill="#5A646E">Улица</text>
  <!-- забор -->
  <path d="M290 672 H48 V224 H760 V672 H390" fill="none" stroke="#5A646E" stroke-width="4" stroke-dasharray="14 6"/>

  <!-- дом -->
  <rect x="90" y="262" width="170" height="120" fill="#DCDAD3" stroke="#5A646E" stroke-width="3"/>
  <text x="175" y="330" font-size="24" font-weight="700" fill="#16181B" text-anchor="middle">Дом</text>

  <!-- проезд техники -->
  <path d="M300 740 V470 Q300 452 318 452 H342 Q360 452 360 470 V740 Z" fill="#FAEBC8" stroke="#F2B01E" stroke-width="3"/>
  <text x="330" y="610" font-size="22" font-weight="700" fill="#7E5900" text-anchor="middle" transform="rotate(-90 330 610)">проезд техники</text>
  <!-- скважина -->
  <circle cx="330" cy="430" r="26" fill="#DCEBE2" stroke="#2C7350" stroke-width="4"/>
  <circle cx="330" cy="430" r="11" fill="#8C949C" stroke="#16181B" stroke-width="3"/>
  <text x="228" y="438" font-size="24" font-weight="700" fill="#2C7350" text-anchor="middle">Скважина</text>

  <!-- будущая баня -->
  <rect x="420" y="262" width="150" height="96" fill="none" stroke="#5A646E" stroke-width="3" stroke-dasharray="10 7"/>
  <text x="495" y="302" font-size="22" font-weight="700" fill="#5A646E" text-anchor="middle">баня</text>
  <text x="495" y="330" font-size="22" fill="#5A646E" text-anchor="middle">в планах</text>
  <!-- будущее дерево -->
  <circle cx="420" cy="440" r="32" fill="none" stroke="#2C7350" stroke-width="3" stroke-dasharray="8 6"/>
  <circle cx="420" cy="440" r="5" fill="#2C7350"/>
  <text x="420" y="500" font-size="22" fill="#2C7350" text-anchor="middle">дерево</text>

  <!-- низина и сток -->
  <ellipse cx="620" cy="580" rx="104" ry="50" fill="#CFE3EE" stroke="#3B7EA1" stroke-width="2"/>
  <text x="620" y="588" font-size="22" font-weight="700" fill="#3B7EA1" text-anchor="middle">низина</text>
  <path d="M700 300 Q700 420 660 520" fill="none" stroke="#3B7EA1" stroke-width="4" marker-end="url(#aw)"/>
  <path d="M610 380 Q614 450 614 518" fill="none" stroke="#3B7EA1" stroke-width="4" marker-end="url(#aw)"/>
  <path d="M500 420 Q540 480 568 530" fill="none" stroke="#3B7EA1" stroke-width="4" marker-end="url(#aw)"/>

  <!-- маркеры -->
  <circle cx="410" cy="620" r="20" fill="#F2B01E"/>
  <text x="410" y="628" font-size="22" font-weight="700" fill="#16181B" text-anchor="middle">1</text>
  <circle cx="600" cy="310" r="20" fill="#F2B01E"/>
  <text x="600" y="318" font-size="22" font-weight="700" fill="#16181B" text-anchor="middle">2</text>
  <circle cx="484" cy="590" r="20" fill="#F2B01E"/>
  <text x="484" y="598" font-size="22" font-weight="700" fill="#16181B" text-anchor="middle">3</text>
  <circle cx="530" cy="188" r="20" fill="#F2B01E"/>
  <text x="530" y="196" font-size="22" font-weight="700" fill="#16181B" text-anchor="middle">4</text>

  <!-- легенда -->
  <rect x="784" y="150" width="368" height="602" rx="10" fill="#FFFFFF" stroke="#C7C4BA" stroke-width="2"/>
  <circle cx="820" cy="190" r="18" fill="#F2B01E"/>
  <text x="820" y="198" font-size="22" font-weight="700" fill="#16181B" text-anchor="middle">1</text>
  <text x="850" y="198" font-size="24" font-weight="700" fill="#16181B">Подъезд — и потом</text>
  <text x="850" y="228" font-size="22" fill="#5A646E">не только для бурения:</text>
  <text x="850" y="256" font-size="22" fill="#5A646E">ремонт, прочистка, замена</text>
  <text x="850" y="284" font-size="22" fill="#5A646E">насоса — тоже с техникой</text>

  <circle cx="820" cy="336" r="18" fill="#F2B01E"/>
  <text x="820" y="344" font-size="22" font-weight="700" fill="#16181B" text-anchor="middle">2</text>
  <text x="850" y="344" font-size="24" font-weight="700" fill="#16181B">Будущие постройки</text>
  <text x="850" y="374" font-size="22" fill="#5A646E">баня, гараж, теплица не</text>
  <text x="850" y="402" font-size="22" fill="#5A646E">должны зажать оголовок;</text>
  <text x="850" y="430" font-size="22" fill="#5A646E">крупные деревья рядом —</text>
  <text x="850" y="458" font-size="22" fill="#5A646E">не сажать — это совет</text>

  <circle cx="820" cy="510" r="18" fill="#F2B01E"/>
  <text x="820" y="518" font-size="22" font-weight="700" fill="#16181B" text-anchor="middle">3</text>
  <text x="850" y="518" font-size="24" font-weight="700" fill="#16181B">Не в низину</text>
  <text x="850" y="548" font-size="22" fill="#5A646E">и не на пути стока:</text>
  <text x="850" y="576" font-size="22" fill="#5A646E">вода уходит от оголовка</text>

  <circle cx="820" cy="628" r="18" fill="#F2B01E"/>
  <text x="820" y="636" font-size="22" font-weight="700" fill="#16181B" text-anchor="middle">4</text>
  <text x="850" y="636" font-size="24" font-weight="700" fill="#16181B">Септик соседа</text>
  <text x="850" y="666" font-size="22" fill="#5A646E">скважина — не менее чем</text>
  <text x="850" y="694" font-size="22" fill="#5A646E">в 50 м выше по потоку</text>
  <text x="850" y="722" font-size="22" fill="#5A646E">грунтовых вод (п. 85)</text>
</svg>
