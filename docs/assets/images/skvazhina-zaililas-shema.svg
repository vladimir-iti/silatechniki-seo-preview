<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Заиливание скважины: при работе насоса поток выносит взвесь, при долгом простое она оседает, слёживается и заполняет отстойник" font-family="'Golos Text', 'Helvetica Neue', Arial, sans-serif">
  <rect width="1200" height="800" fill="#F1F0EC"/>
  <defs>
    <marker id="up" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3B7EA1"/>
    </marker>
    <marker id="dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1 L10 5 L0 9" fill="none" stroke="#5A646E" stroke-width="1.5"/>
    </marker>
    <g id="well">
      <rect x="72" y="220" width="188" height="110" fill="#B98C62"/>
      <rect x="72" y="330" width="188" height="150" fill="#E3CF9E"/>
      <rect x="72" y="480" width="188" height="186" fill="#B98C62"/>
      <rect x="120" y="220" width="60" height="430" fill="#CFE3EE"/>
      <rect x="114" y="220" width="6" height="110" fill="#8C949C"/>
      <rect x="180" y="220" width="6" height="110" fill="#8C949C"/>
      <line x1="117" y1="330" x2="117" y2="480" stroke="#8C949C" stroke-width="6" stroke-dasharray="10 8"/>
      <line x1="183" y1="330" x2="183" y2="480" stroke="#8C949C" stroke-width="6" stroke-dasharray="10 8"/>
      <rect x="114" y="480" width="6" height="176" fill="#8C949C"/>
      <rect x="180" y="480" width="6" height="176" fill="#8C949C"/>
      <rect x="114" y="650" width="72" height="6" fill="#8C949C"/>
    </g>
  </defs>

  <text x="48" y="84" font-size="36" font-weight="700" fill="#16181B">Почему скважина заиливается</text>
  <text x="48" y="122" font-size="22" fill="#5A646E">Решает не объём водоразбора, а регулярность работы. Условно, не в масштабе</text>

  <!-- левая панель: работа -->
  <rect x="48" y="146" width="540" height="544" rx="12" fill="#FFFFFF" stroke="#C7C4BA" stroke-width="2"/>
  <text x="72" y="194" font-size="26" font-weight="700" fill="#2C7350">Насос работает регулярно</text>
  <use href="#well"/>
  <g fill="#7A5A3A">
    <circle cx="130" cy="300" r="3"/><circle cx="168" cy="262" r="3"/><circle cx="170" cy="360" r="3"/>
    <circle cx="128" cy="410" r="3"/><circle cx="172" cy="450" r="3"/><circle cx="132" cy="520" r="3"/>
    <circle cx="170" cy="560" r="3"/><circle cx="130" cy="600" r="3"/>
  </g>
  <g stroke="#3B7EA1" stroke-width="4" marker-end="url(#up)">
    <line x1="140" y1="470" x2="140" y2="300"/>
    <line x1="160" y1="610" x2="160" y2="400"/>
    <line x1="150" y1="330" x2="150" y2="240"/>
  </g>
  <rect x="120" y="638" width="60" height="12" fill="#B98C62"/>
  <text x="276" y="286" font-size="22" fill="#16181B">Поток идёт вверх</text>
  <text x="276" y="316" font-size="22" fill="#16181B">и выносит взвесь</text>
  <!-- размер отстойника -->
  <line x1="226" y1="480" x2="226" y2="650" stroke="#5A646E" stroke-width="2" marker-start="url(#dim)" marker-end="url(#dim)"/>
  <line x1="190" y1="480" x2="234" y2="480" stroke="#5A646E" stroke-width="2"/>
  <line x1="190" y1="650" x2="234" y2="650" stroke="#5A646E" stroke-width="2"/>
  <text x="276" y="558" font-size="22" font-weight="700" fill="#16181B">Отстойник</text>
  <text x="276" y="588" font-size="22" fill="#16181B">не менее 2 м</text>

  <!-- правая панель: простой -->
  <rect x="612" y="146" width="540" height="544" rx="12" fill="#FFFFFF" stroke="#C7C4BA" stroke-width="2"/>
  <text x="636" y="194" font-size="26" font-weight="700" fill="#A93F26">Простой несколько месяцев</text>
  <g transform="translate(564 0)">
    <use href="#well"/>
    <g fill="#7A5A3A">
      <circle cx="140" cy="330" r="3"/><circle cx="162" cy="372" r="3"/><circle cx="132" cy="404" r="3"/>
      <circle cx="170" cy="420" r="3"/><circle cx="148" cy="436" r="3"/><circle cx="128" cy="444" r="3"/>
      <circle cx="160" cy="446" r="3"/>
    </g>
    <rect x="120" y="455" width="60" height="195" fill="#7A5A3A"/>
    <g fill="#B98C62">
      <circle cx="132" cy="480" r="3"/><circle cx="160" cy="500" r="3"/><circle cx="140" cy="540" r="3"/>
      <circle cx="168" cy="570" r="3"/><circle cx="130" cy="600" r="3"/><circle cx="156" cy="628" r="3"/>
    </g>
    <line x1="268" y1="456" x2="186" y2="470" stroke="#5A646E" stroke-width="2"/>
    <circle cx="186" cy="470" r="5" fill="#16181B"/>
  </g>
  <text x="840" y="286" font-size="22" fill="#16181B">Поток стоит —</text>
  <text x="840" y="316" font-size="22" fill="#16181B">взвесь оседает</text>
  <text x="840" y="446" font-size="22" fill="#16181B">Железо и марганец</text>
  <text x="840" y="476" font-size="22" fill="#16181B">цементируют осадок</text>
  <text x="840" y="558" font-size="22" font-weight="700" fill="#A93F26">Отстойник заполнен,</text>
  <text x="840" y="588" font-size="22" fill="#A93F26">низ фильтра перекрыт</text>

  <text x="48" y="740" font-size="22" fill="#5A646E">Отстойник по СП 31.13330.2021 — расчётный запас под фоновый осадок, а не бесконечный</text>
</svg>
