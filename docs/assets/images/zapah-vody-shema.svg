<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Таблица: запах или привкус воды из скважины, вероятная причина и что сделать; органолептика — не диагноз, нужен лабораторный анализ" font-family="'Golos Text', 'Helvetica Neue', Arial, sans-serif">
  <rect width="1200" height="800" fill="#F1F0EC"/>
  <text x="48" y="84" font-size="36" font-weight="700" fill="#16181B">Запах воды: от симптома к причине</text>
  <text x="48" y="122" font-size="22" fill="#5A646E">Характер запаха подсказывает гипотезу — но не ставит диагноз</text>
  <rect x="48" y="150" width="1104" height="434" rx="10" fill="#FFFFFF" stroke="#C7C4BA" stroke-width="2"/>
  <path d="M48 200 V160 a10 10 0 0 1 10 -10 H1142 a10 10 0 0 1 10 10 V200 Z" fill="#DCDAD3"/>
  <text x="68" y="183" font-size="22" font-weight="700" fill="#16181B">Запах или привкус</text>
  <text x="408" y="183" font-size="22" font-weight="700" fill="#16181B">Вероятная причина</text>
  <text x="828" y="183" font-size="22" font-weight="700" fill="#16181B">Что сделать</text>
  <text x="68" y="256" font-size="24" font-weight="700" fill="#16181B">Тухлые яйца</text>
  <text x="408" y="242" font-size="24" fill="#16181B">Сероводород</text>
  <text x="408" y="272" font-size="22" fill="#5A646E">возможна затопленная выработка</text>
  <text x="828" y="256" font-size="24" fill="#A93F26">Не пить, сделать анализ</text>
  <line x1="48" y1="296" x2="1152" y2="296" stroke="#DCDAD3" stroke-width="2"/>
  <text x="68" y="352" font-size="24" font-weight="700" fill="#16181B">Болотный, затхлый</text>
  <text x="408" y="338" font-size="24" fill="#16181B">Железобактерии</text>
  <text x="408" y="368" font-size="22" fill="#5A646E">на фоне природного железа</text>
  <text x="828" y="352" font-size="24" fill="#16181B">Лабораторный анализ</text>
  <line x1="48" y1="392" x2="1152" y2="392" stroke="#DCDAD3" stroke-width="2"/>
  <text x="68" y="448" font-size="24" font-weight="700" fill="#16181B">Металлический привкус</text>
  <text x="408" y="434" font-size="24" fill="#16181B">Растворённое железо</text>
  <text x="408" y="464" font-size="22" fill="#5A646E">реже марганец</text>
  <text x="828" y="434" font-size="24" fill="#16181B">Анализ, водоподготовка</text>
  <text x="828" y="464" font-size="22" fill="#5A646E">обычно обезжелезивание</text>
  <line x1="48" y1="488" x2="1152" y2="488" stroke="#DCDAD3" stroke-width="2"/>
  <text x="68" y="544" font-size="24" font-weight="700" fill="#16181B">Пропадает после слива</text>
  <text x="408" y="544" font-size="24" fill="#16181B">Застой воды в системе</text>
  <text x="828" y="530" font-size="24" fill="#16181B">Слить несколько минут</text>
  <text x="828" y="560" font-size="22" fill="#5A646E">не прошло — анализ</text>
  <line x1="388" y1="150" x2="388" y2="584" stroke="#DCDAD3" stroke-width="2"/>
  <line x1="808" y1="150" x2="808" y2="584" stroke="#DCDAD3" stroke-width="2"/>
  <rect x="48" y="150" width="1104" height="434" rx="10" fill="none" stroke="#C7C4BA" stroke-width="2"/>
  <rect x="48" y="612" width="1104" height="140" rx="10" fill="#F3DDD6" stroke="#A93F26" stroke-width="3"/>
  <text x="76" y="660" font-size="26" font-weight="700" fill="#A93F26">Органолептика — не диагноз</text>
  <text x="76" y="696" font-size="22" fill="#16181B">Часть отклонений не ощущается вовсе: вода пахнет нормально, но не проходит</text>
  <text x="76" y="726" font-size="22" fill="#16181B">по санитарным показателям. Ответ даёт только лабораторный анализ</text>
</svg>
